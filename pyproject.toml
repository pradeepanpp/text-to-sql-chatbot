[project]
name = "text-to-sql-chatbot"
version = "1.1.0"
description = "Bilingual (English/Arabic) natural-language-to-SQL assistant with a SQL safety layer and an execution-accuracy benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pradeepanpp" }]
# Runtime dependencies are pinned in requirements.txt (used by Docker and CI).

# ── pytest ─────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]            # lets tests import `src.text_to_sql...` without sys.path hacks
addopts = "-ra"
filterwarnings = [
    # create_react_agent moved to langchain.agents in LangGraph 1.0; still supported until 2.0
    "ignore::DeprecationWarning:langgraph.*",
    "ignore:.*create_react_agent has been moved.*",
]

# ── ruff (lint) ────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["data", "database", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B008"]   # pyflakes + core pycodestyle + mutable-default bugs
ignore = [
    "E402",   # modules call load_dotenv() / set sys.path before importing project code
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]   # Depends() in defaults is the FastAPI idiom
