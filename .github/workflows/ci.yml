# Continuous integration: lint, offline tests, and Docker image builds.
#
# Runs on every push to main and on every pull request.
# Live tests (real OpenAI calls, real database) are skipped automatically
# by tests/conftest.py because CI has no API key and no data — so CI never
# spends money and never needs secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.8
      - run: ruff check .

  test:
    name: Tests (pytest, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile --target runtime -t text-to-sql-api .
      - name: Build dashboard image
        run: docker build -f Dockerfile.dashboard -t text-to-sql-dashboard .
